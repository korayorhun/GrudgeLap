; Hardware ray tracing (0.74): Lumen traces the scene's geometry instead of its distance fields, and reflections are lit
; where the ray lands (LightingMode 2) instead of read from the surface cache: the paint, the glass and the wet road
; mirror their surroundings, the strongest single cue of a photograph in a car game. A card without ray tracing keeps
; software Lumen; the skin cache shaders are a requirement of the setting.
r.RayTracing=True
r.SkinCache.CompileShaders=True
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=2

