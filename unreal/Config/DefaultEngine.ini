[SystemSettings]
; Lumen's cached lighting is stored pre-exposed; the default (4 EV) covers exposures up to EV 12, and the level's
; fixed daylight exposure is EV 13, which clipped it (and put a warning on screen). 8 covers EV -4 to 16.
r.EyeAdaptation.CachedLightingPreExposure=8
; A fixed 75 % of the window, upscaled: by NVIDIA DLSS (README step 4) in its Quality mode on an RTX card, by TSR
; anywhere else. Dynamic resolution (70 to 100 %, on until the first packaged build) held 60 fps on the development
; laptop's GPU (RTX 5060 Laptop) under TSR, but the DLSS plugin picks its mode once a frame by the range's top and took
; DLAA (99 to 100 % only); the first frame dynamic resolution rendered below that stopped the packaged game on DLSS's
; assertion, with the top at 98 % as at 100 %. At 75 % DLSS takes Quality (50 to 100 %).
r.DynamicRes.OperationMode=0
r.ScreenPercentage=75
r.NGX.DLSS.Enable=1
; The virtual shadow maps keep a page until something in it moves (0.77). A page drawn while Nanite was still streaming
; a mesh in kept that mesh's coarse shadow: at the start line a shadow some 20 m across lay over the road and the verges
; with nothing left to cast it (in 0.76's level too, and in every 0.77 build; gone without the cache, r.Shadow.Virtual.Cache 0).
; Clusters that stream in to their level of detail now invalidate the pages they were drawn into. On perf.cmd's lap by
; day 16.48 ms with it against 16.44 without, within the spread between runs.
r.Nanite.VSMInvalidateOnLODDelta=1
